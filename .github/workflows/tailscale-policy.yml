name: Validate and apply Tailscale policy

on:
  pull_request:
    branches: [main]
    paths:
      - tailscale/policy.hujson
      - .github/workflows/tailscale-policy.yml
  push:
    branches: [main]
    paths:
      - tailscale/policy.hujson
      - .github/workflows/tailscale-policy.yml

permissions:
  contents: read
  id-token: write

jobs:
  policy:
    name: Tailscale policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate policy on pull request
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: tailscale/policy.hujson
          action: test

      - name: Apply policy after merge to main
        if: github.event_name == 'push'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: tailscale/policy.hujson
          action: apply
